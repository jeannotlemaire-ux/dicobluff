name: Synchronisation du pool du mot du jour

# Relance generate-wod-pool.js et pousse wod-pool.js s'il a changé. Le fichier
# ne contient aucune date (le site calcule le mot à la volée avec wod.js, comme
# le jeu) : il n'y a donc plus rien à rafraîchir périodiquement, seulement à
# resynchroniser quand les mots de game.html changent.

on:
  push:
    branches: [main]
    paths:
      - game.html
      - wod.js
      - generate-wod-pool.js
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node generate-wod-pool.js

      - name: Commit et push si le pool a changé
        run: |
          if [ -z "$(git status --porcelain -- wod-pool.js)" ]; then
            echo "Rien à faire — wod-pool.js déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wod-pool.js
          git commit -m "chore: resynchronise wod-pool.js (pool du mot du jour)"
          git push
